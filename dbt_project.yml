name: brecho
version: "1.0.0"
profile: brecho

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

# Antes de cada execução, garante que a função de correção de encoding existe no banco.
on-run-start:
  - "create extension if not exists unaccent"
  - "{{ criar_funcao_corrigir_encoding() }}"

models:
  brecho:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view

seeds:
  brecho:
    +schema: seeds
