services:
  postgres:
    image: postgres:16
    container_name: brecho_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - brecho_pgdata:/var/lib/postgresql/data

volumes:
  brecho_pgdata: