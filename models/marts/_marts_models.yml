version: 2

models:
  - name: dim_marca
    description: Uma linha por marca padronizada, com estatísticas de peças e preços.
    columns:
      - name: marca_id
        description: Chave da marca (hash do nome padronizado).
        data_tests: [unique, not_null]
      - name: marca
        data_tests: [unique, not_null]
      - name: marca_mae
        description: 'Marca principal da linha (ex.: "Zara" para "Zara Kids"). Igual à própria marca quando não há hierarquia.'
        data_tests: [not_null]
      - name: marca_parceira
        description: 'Em collabs, a outra marca da parceria (ex.: "C&A" em "Maria Filó para C&A").'
      - name: grupo
        description: 'Empresa ou varejista dono da marca (ex.: "Renner" para "Blue Steel"). Vazio em collabs vendidas pelas duas marcas.'
      - name: segmento
        description: Tipo de linha (Infantil, Bebê, Juvenil, Masculino, Esportivo, Jeans, Básico).
      - name: e_collab
        description: 'Verdadeiro para colaborações entre marcas. Nesse caso, marca_mae é quem assina e marca_parceira é a outra marca.'
        data_tests: [not_null]
      - name: faixa_preco
        description: 'Faixa pelo preço mediano no brechó. Limites em dbt_project.yml (vars faixa_preco_*).'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Acessível', 'Intermediária', 'Premium', 'Luxo', 'Poucos dados', 'Não se aplica']
      - name: e_marca_identificada
        description: Falso para "Sem marca" e "Não informada".

  - name: dim_tipo_peca
    description: Uma linha por tipo de peça, com um agrupamento amplo (grupo_produto).
    columns:
      - name: tipo_peca_id
        data_tests: [unique, not_null]
      - name: grupo_produto
        data_tests:
          - accepted_values:
              arguments:
                values: ['Roupa', 'Calçado', 'Bolsa', 'Acessório', 'Outros']

  - name: dim_condicao
    description: Uma linha por condição, com a ordem de conservação (1 = mais conservada).
    columns:
      - name: condicao_id
        data_tests: [unique, not_null]

  - name: dim_vendedora
    description: >
      Uma linha por vendedora do marketplace, com o volume de anúncios e
      indicadores de qualidade do cadastro (em % dos anúncios dela).
    columns:
      - name: id_vendedora
        data_tests: [unique, not_null]
      - name: estilo_escrita
        description: Informação da simulação (num site real, não existiria). Serve para conferir os indicadores.
      - name: pct_sem_tamanho
        description: '% dos anúncios sem tamanho informado.'
      - name: pct_sem_cor
        description: '% dos anúncios em que a cor não foi informada e teve de ser inferida.'
      - name: pct_marca_regra
        description: '% dos anúncios cuja marca só foi resolvida por uma regra do map_marca.'

  - name: fct_anuncios
    description: >
      Uma linha por peça anunciada (histórico e marketplace). Ponto de partida
      para análises: junte com as dimensões pelas colunas *_id e id_vendedora.
    columns:
      - name: id_peca
        data_tests: [unique, not_null]
      - name: origem
        data_tests:
          - accepted_values:
              arguments:
                values: ['historico', 'marketplace']
      - name: id_vendedora
        description: Quem cadastrou. Nulo no histórico.
        data_tests:
          - not_null:
              config:
                where: "origem = 'marketplace'"
          - relationships:
              arguments:
                to: ref('dim_vendedora')
                field: id_vendedora
      - name: data_cadastro
        description: Data e hora do cadastro. Nulo no histórico.
      - name: marca_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_marca')
                field: marca_id
      - name: tipo_peca_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_peca')
                field: tipo_peca_id
      - name: condicao_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_condicao')
                field: condicao_id
      - name: preco_venda
        description: Preço da peça no brechó, em reais.
        data_tests: [not_null]
      - name: preco_original
        description: Preço da peça nova, em reais. Pode ser nulo.
      - name: desconto_percentual
        description: Quanto o preço do brechó é menor que o da peça nova, em %. Nulo quando não há preço original.
      - name: preco_suspeito
        description: Verdadeiro quando o preço no brechó é maior que o da peça nova (provável erro de cadastro).

  - name: fct_drop_eventos
    description: >
      Uma linha por evento dos drops (clique), com a marcação de suspeita de bot
      calculada por uma janela deslizante de 10 segundos.
    columns:
      - name: id_evento
        data_tests: [unique, not_null]
      - name: e_cliente_suspeita_bot
        description: 'Verdadeiro se a cliente fez mais carrinhos em 10s do que o limite (var limite_bot_carrinhos_10s).'

  - name: fct_drop_pecas
    description: >
      Uma linha por peça em cada drop: funil, compras recusadas e tempo até vender,
      com marca e tipo de peça. Eventos de clientes suspeitas de bot ficam de fora.
    columns:
      - name: marca_id
        description: 'Vazio se a peça do drop ainda não estiver no fct_anuncios (rode a carga e o dbt antes do drop).'
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_marca')
                field: marca_id
              config:
                severity: warn

  - name: dim_drop
    description: >
      Uma linha por drop: duração, peças vendidas, receita, disputas, bots,
      latência e o funil de clientes (viram -> carrinho -> compraram).
    columns:
      - name: id_drop
        data_tests: [unique, not_null]
