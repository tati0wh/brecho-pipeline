version: 2

sources:
  - name: raw
    description: Dados brutos, sem nenhuma alteração nos valores.
    schema: raw
    tables:
      - name: roupas_usadas
        description: >
          Anúncios do CSV histórico, exatamente como vieram.
          Carregado pelo script scripts/carregar_raw.py.
      - name: anuncios
        description: >
          Anúncios que chegam do marketplace, um arquivo por dia.
          Carregado de forma incremental pelo script scripts/carregar_novos.py.
      - name: vendedoras
        description: >
          Cadastro das vendedoras do marketplace (substituído a cada carga).
          O estilo_escrita é uma informação da simulação: num site real, não existiria.
      - name: drop_eventos
        description: >
          Eventos dos drops, gravados em tempo real pelo consumidor
          scripts/streaming/processar_drop.py (sem duplicados).
